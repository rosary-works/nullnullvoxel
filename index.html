<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06050f">
<title>ヌルヌルの鼓動</title>
<style>
  :root { --fg:#ecebe8; --dim:#8d8c93; --glass:rgba(12,12,16,.66); --line:rgba(255,255,255,.09); --acc:#ffb35c; --rec:#ff5a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#050507; color:var(--fg); overflow:hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button { font:inherit; color:inherit; }

  /* dock: bottom-centre on portrait, right rail on landscape */
  #dock { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; gap:4px; padding:6px; border-radius:22px; background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3); transition:opacity .4s, transform .4s; z-index:5; }
  @media (orientation:landscape) and (min-width:700px){
    #dock { left:auto; right:calc(16px + env(safe-area-inset-right)); top:50%; bottom:auto; transform:translateY(-50%); flex-direction:column; }
  }
  .ib { width:58px; height:56px; border:0; border-radius:16px; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--dim); transition:background .2s, color .2s; }
  @media (max-width:420px){ .ib { width:48px; } .ib span { font-size:9.5px; } }
  @media (max-width:370px){ .ib { width:44px; } .ib span { font-size:9px; letter-spacing:-.04em; } }
  .ib svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .ib span { font-size:10px; letter-spacing:.04em; white-space:nowrap; }
  .ib .emo { transition:transform .15s; }
  .ib.on .emo.beat { transform:scale(1.18); }
  .ib:hover { background:rgba(255,255,255,.05); color:var(--fg); }
  .ib.on { color:var(--acc); background:rgba(255,179,92,.10); }
  .ib.recording { color:var(--acc); background:rgba(255,179,92,.12); }
  .ib.recording svg .core { animation:breathe 1.6s ease-in-out infinite; transform-origin:12px 12px; }
  @keyframes breathe { 50% { transform:scale(.62); opacity:.55; } }
  .sep { width:1px; margin:8px 2px; background:var(--line); }
  @media (orientation:landscape) and (min-width:700px){ .sep { width:auto; height:1px; margin:2px 8px; } }

  #mark { position:fixed; left:calc(18px + env(safe-area-inset-left)); top:calc(16px + env(safe-area-inset-top));
    font-size:11px; letter-spacing:.32em; color:rgba(255,255,255,.35); pointer-events:none; transition:opacity .4s; }
  #mark i { display:block; font-style:normal; font-size:10px; letter-spacing:.06em; margin-top:4px; color:rgba(255,255,255,.4); }
  #mark b { display:block; font-weight:500; font-size:13px; letter-spacing:.18em; color:rgba(255,255,255,.6); margin-bottom:2px; }

  /* tuning panel */
  #panel { position:fixed; z-index:6; background:rgba(14,14,18,.86); border:1px solid var(--line);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); display:flex; flex-direction:column; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s; }
  #panel { left:8px; right:8px; bottom:calc(84px + env(safe-area-inset-bottom)); max-height:56vh; border-radius:20px; }
  #panel.closed { transform:translateY(16px); opacity:0; pointer-events:none; }
  @media (orientation:landscape) and (min-width:700px){
    #panel { left:auto; right:96px; top:16px; bottom:16px; width:340px; max-height:none; }
    #panel.closed { transform:translateX(16px); }
  }
  .ph { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px; }
  .ph b { font-size:14px; font-weight:600; letter-spacing:.08em; }
  .ph button { border:0; background:rgba(255,255,255,.06); width:30px; height:30px; border-radius:50%; cursor:pointer; color:var(--dim); font-size:16px; }
  .tabs { display:flex; gap:2px; padding:4px 12px 10px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { border:0; background:transparent; color:var(--dim); font-size:12px; padding:7px 11px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .tab.on { color:#111; background:var(--acc); font-weight:600; }
  .pb { overflow-y:auto; padding:4px 16px 16px; }
  .pane { display:none; } .pane.on { display:block; }
  .sw { display:grid; grid-template-columns:repeat(auto-fill, minmax(62px,1fr)); gap:10px 6px; }
  .s { border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--dim); font-size:10.5px; padding:0; white-space:nowrap; letter-spacing:-.02em; }
  .s i { width:40px; height:40px; border-radius:50%; display:block; box-shadow:0 0 0 2px transparent, inset 0 0 0 1px rgba(255,255,255,.15); transition:box-shadow .2s, transform .2s; }
  .s.on { color:var(--fg); } .s.on i { box-shadow:0 0 0 2px #0e0e12, 0 0 0 4px var(--acc); transform:scale(1.04); }
  .row { display:grid; grid-template-columns:7.2em 1fr 2.6em; align-items:center; gap:10px; margin:10px 0; font-size:12.5px; }
  .row output { text-align:right; color:var(--dim); font-size:11px; font-family:ui-monospace, Menlo, monospace; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:3px; border-radius:3px; background:rgba(255,255,255,.14); }
  input[type=range]::-moz-range-track { height:3px; border-radius:3px; background:rgba(255,255,255,.14); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; margin-top:-6.5px; border-radius:50%; background:var(--acc); border:3px solid #16161b; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--acc); border:3px solid #16161b; }
  select { width:100%; background:rgba(255,255,255,.05); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12.5px; }
  .hint { font-size:11px; color:var(--dim); margin-top:14px; line-height:1.7; }

  body.immersive #dock, body.immersive #panel, body.immersive #mark { opacity:0; pointer-events:none; }
  .pop { position:fixed; z-index:8; right:calc(10px + env(safe-area-inset-right)); bottom:calc(92px + env(safe-area-inset-bottom)); width:250px;
    background:rgba(14,14,18,.94); border:1px solid var(--line); border-radius:18px; padding:14px 10px 10px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    transition:opacity .2s, transform .2s; }
  .pop.left { right:auto; left:calc(10px + env(safe-area-inset-left)); }
  .pop.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
  @media (orientation:landscape) and (min-width:700px){ .pop { right:96px; bottom:auto; top:50%; transform:translateY(-50%); } .pop.hidden { transform:translate(8px,-50%); } }
  .pop b { display:block; font-size:12px; letter-spacing:.12em; color:var(--dim); padding:0 8px 8px; font-weight:500; }
  .opt { display:flex; gap:12px; align-items:baseline; justify-content:space-between; width:100%; border:0; background:transparent; color:var(--fg); font-size:13px; padding:10px 10px; border-radius:10px; cursor:pointer; text-align:left; }
  .opt small { color:var(--dim); font-size:11px; }
  .opt.on { background:rgba(255,179,92,.14); color:var(--acc); }
  .dlg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(340px, calc(100% - 32px)); z-index:10;
    background:rgba(16,16,20,.94); border:1px solid var(--line); border-radius:20px; padding:20px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .dlg.hidden { display:none; }
  .dlg b { font-size:15px; letter-spacing:.06em; } .dlg p { font-size:12.5px; line-height:1.7; color:var(--dim); margin:10px 0 16px; }
  .dbtn { display:flex; flex-wrap:wrap; gap:8px; }
  .pill { border:0; border-radius:999px; padding:10px 14px; font-size:12.5px; background:var(--acc); color:#111; font-weight:600; cursor:pointer; }
  .pill.ghost { background:rgba(255,255,255,.08); color:var(--fg); font-weight:400; }
  #toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--glass); padding:10px 16px;
    border-radius:12px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
  #recbar { position:fixed; top:calc(16px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right)); font-size:12px;
    color:#111; background:var(--acc); padding:6px 12px; border-radius:999px; display:none; font-family:ui-monospace, Menlo, monospace; z-index:7; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="mark"><b>ヌルヌルの鼓動</b><i>非公式ファンアート</i></div>

<nav id="dock">
  <button class="ib on" id="bVox"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M3.5 3.5l5.2 5.2M20.5 3.5l-5.2 5.2M3.5 20.5l5.2-5.2M20.5 20.5l-5.2-5.2"/></svg><span>ボクセル</span></button>
  <button class="ib" id="bMir"><svg viewBox="0 0 24 24"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"/><path d="M6.3 12c1.5-2.4 3.4-3.6 5.7-3.6s4.2 1.2 5.7 3.6c-1.5 2.4-3.4 3.6-5.7 3.6S7.8 14.4 6.3 12z"/><circle cx="12" cy="12" r="1.7"/></svg><span>投影</span></button>
  <button class="ib" id="bImm"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全画面</span></button>
  <button class="ib" id="bSnd"><svg class="emo" viewBox="0 0 24 24"><path d="M12 20.3s-7.4-4.5-8.8-9.4C2.3 7.6 4.4 4.6 7.5 4.6c2 0 3.5 1.1 4.5 2.6 1-1.5 2.5-2.6 4.5-2.6 3.1 0 5.2 3 4.3 6.3-1.4 4.9-8.8 9.4-8.8 9.4z"/><path d="M3.4 11.6h5l1.4-2.4 2.2 5.2 1.6-3.6.8.8h6.2"/></svg><span>鼓動</span></button>
  <div class="sep"></div>
  <button class="ib rec" id="bRec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" stroke-width="2"/><circle class="core" cx="12" cy="12" r="5.2" fill="currentColor" stroke="none"/></svg><span>記録</span></button>
  <button class="ib" id="bSet"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>調整</span></button>
  <button class="ib" id="bDen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="4" rx=".8"/><rect x="10" y="4" width="4" height="4" rx=".8"/><rect x="16" y="4" width="4" height="4" rx=".8"/><rect x="4" y="10" width="4" height="4" rx=".8"/><rect x="10" y="10" width="4" height="4" rx=".8"/><rect x="16" y="10" width="4" height="4" rx=".8"/><rect x="4" y="16" width="4" height="4" rx=".8"/><rect x="10" y="16" width="4" height="4" rx=".8"/><rect x="16" y="16" width="4" height="4" rx=".8"/></svg><span>粒度</span></button>
</nav>
<div id="recbar"></div>
<div id="denPop" class="pop hidden">
  <b>粒度</b>
  <div id="denList"></div>
</div>
<div id="mirPop" class="pop left hidden">
  <b>投影するもの</b>
  <button class="opt" data-k="front"><span>フロントカメラ</span><small>顔は映りにくく</small></button>
  <button class="opt" data-k="back"><span>背面カメラ</span><small></small></button>
  <label class="opt" data-k="pick"><span>画像・動画</span><small>選ぶ</small><input type="file" id="camPick" accept="image/*,video/*" hidden></label>
  <label class="opt" data-k="shot"><span>撮影</span><small>その場で撮る</small><input type="file" id="camShot" accept="image/*" capture="environment" hidden></label>
  <button class="opt" id="mirStop"><span>投影をやめる</span><small></small></button>
</div>

<section id="panel" class="closed">
  <div class="ph"><b>調整</b><button id="bClose" aria-label="閉じる">×</button></div>
  <div class="tabs">
    <button class="tab on" data-p="pColor">色</button><button class="tab" data-p="pFlow">流れ</button>
    <button class="tab" data-p="pHole">黒い穴</button><button class="tab" data-p="pSurf">光</button>
    <button class="tab" data-p="pLook">質感</button><button class="tab" data-p="pOut">書き出し</button>
  </div>
  <div class="pb">
    <div class="pane on" id="pColor">
      <div class="sw" id="palettes"></div>

    </div>
    <div class="pane" id="pFlow"><div id="motion"></div></div>
    <div class="pane" id="pHole"><div id="holes"></div></div>
    <div class="pane" id="pSurf"><div id="surface"></div></div>
    <div class="pane" id="pLook"><div id="look"></div></div>
    <div class="pane" id="pOut">
      <div class="row"><span>記録の長さ</span>
        <select id="recLen"><option value="15">15秒</option><option value="30" selected>30秒</option><option value="60">1分</option><option value="180">3分</option><option value="600">10分</option></select><span></span></div>
      <div class="row" id="vibRow"><span>振動</span>
        <select id="vib"><option value="1" selected>オン（鼓動に合わせて）</option><option value="0">オフ</option></select><span></span></div>
      <div class="row"><span></span><button class="pill ghost" id="vibTest" style="justify-self:start">振動テスト</button><span></span></div>
      <div class="row"><span>音量</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"><output id="volo">0.70</output></div>
      <div class="hint">「鼓動」をオンにすると、対応しているスマホ（主にAndroid）は鼓動に合わせて振動します。iPhoneは振動に対応していません。</div>
      <div class="hint">「投影」から、フロントカメラ・背面カメラ・画像や動画・撮影を選ぶと、ボクセルのミラーに映ります。カメラは https のページで開いたときに使えます。</div>
      <div class="hint">画面をドラッグすると、その場所に渦が生まれます。<br>全画面中は画面をダブルタップで戻ります。<br><br>このページは展示「null²」に着想を得て個人が作った非公式のファンアートです。作者・展示の公式とは関係ありません。</div>
    </div>
  </div>
</section>
<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- shaders
const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

// Pass 1: height field (R = height, G = auxiliary flow value)
const FS_H = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uTime, uBoil, uFlow, uScale, uWarp, uFine, uRidge, uCell;
uniform vec2 uSeed; uniform vec4 uV[8]; uniform int uVN;
uniform vec4 uHole[6]; uniform int uHN; uniform float uRingAmp, uRingF, uMirror, uStretch, uOct;

vec3 hash33(vec3 p){ p = fract(p*vec3(.1031,.1030,.0973)); p += dot(p, p.yxz+33.33);
  return -1.0+2.0*fract((p.xxy+p.yxx)*p.zyx); }
float gn(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(mix(dot(hash33(i),f), dot(hash33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash33(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash33(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash33(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
const mat2 R2 = mat2(.8,.6,-.6,.8);
float fbm(vec3 p){ float s=0., a=.55; for(int i=0;i<5;i++){ if(float(i)>=uOct) break; s+=a*gn(p); p.xy=R2*p.xy*2.02; p.z*=1.4; a*=.5; } return s; }
vec2 h22(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float vedge(vec2 x, float t){ vec2 n=floor(x), f=fract(x); vec2 mg, mr; float md=8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(i,j); vec2 oo=0.5+0.5*sin(t+6.2831*h22(n+g)); vec2 r=g+oo-f; float d=dot(r,r); if(d<md){md=d;mr=r;mg=g;} }
  md=8.; for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){ vec2 g=mg+vec2(i,j); vec2 oo=0.5+0.5*sin(t+6.2831*h22(n+g)); vec2 r=g+oo-f;
    if(dot(mr-r,mr-r)>1e-5) md=min(md, dot(0.5*(mr+r), normalize(r-mr))); }
  return md; }

void main(){
  vec2 P = (vUv-0.5)*vec2(uRes.x/uRes.y,1.0);
  if(uMirror>0.5) P.x = abs(P.x);
  float mask = 0.; float rr[6];
  for(int i=0;i<6;i++){ rr[i]=1e3; if(i>=uHN) break; vec4 hv=uHole[i]; vec2 d=P-hv.xy; float r=length(d); float Rd=hv.z;
    rr[i] = r-Rd;
    mask = max(mask, smoothstep(Rd+0.003, Rd-0.003, r));
    float rs = sqrt(max(r*r-Rd*Rd, 0.));                 // hole pushes the liquid outward -> film around it
    float a = hv.w*1.6*pow(Rd/max(r,Rd), 1.3);           // spiral twist reaching far out
    vec2 dir = d/max(r,1e-4); float c=cos(a), s=sin(a); dir = mat2(c,s,-s,c)*dir;
    P = hv.xy + dir*rs; }
  for(int i=0;i<8;i++){ if(i>=uVN) break; vec4 v=uV[i]; vec2 d=P-v.xy; float a=v.z*exp(-dot(d,d)/(v.w*v.w));
    float c=cos(a), s=sin(a); P = v.xy + mat2(c,s,-s,c)*d; }
  vec2 p = P*uScale; p.y *= mix(1.0, 0.45, uStretch); p += uSeed;
  float t = uTime, b = t*uBoil*0.08;
  vec2 q = vec2(fbm(vec3(p + vec2(0., t*uFlow*0.04), b)), fbm(vec3(p + vec2(5.2,1.3) - vec2(t*uFlow*0.03,0.), b+3.1)));
  vec2 r = vec2(fbm(vec3(p + 3.0*q + vec2(1.7,9.2) + t*uFlow*0.025, b*0.7)),
                fbm(vec3(p + 3.0*q + vec2(8.3,2.8) - t*uFlow*0.02, b*0.7+7.)));
  float h = fbm(vec3(p + uWarp*r, b*0.5+11.))*0.75 + 0.5;
  float ridge = pow(clamp(1.0-abs(2.0*h-1.0),0.,1.), uFine);
  float hh = mix(h, ridge, uRidge);
  if(uCell>0.001){ float e = vedge((p + 0.8*r)*2.2, t*0.15*uFlow); hh += uCell*0.35*(smoothstep(0.0,0.14,e)-1.0); }
  for(int i=0;i<6;i++){ if(i>=uHN) break; float x=rr[i]; float Rd=uHole[i].z;
    if(x>0.){ float env = exp(-x/(Rd*1.3)); hh += uRingAmp*0.12*sin(x/Rd*uRingF*6.2831 + q.x*5.0 + r.y*3.0 - t*1.3)*env; } }
  float prox = 0.;
  for(int i=0;i<6;i++){ if(i>=uHN) break; float Rd=uHole[i].z; prox = max(prox, exp(-max(rr[i],0.)/(Rd*1.2))); hh += 0.25*exp(-max(rr[i],0.)/(Rd*1.6)); }
  hh = mix(hh, -0.25, mask);
  o = vec4(hh, mix(length(r)*0.9 + q.x*0.6, q.x*1.6 + r.y*0.9, step(0.5, 4.0-uOct)), mask, prox*(1.0-mask));
}`;

// Pass 2: lighting
const FS_S = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uH; uniform vec2 uRes; uniform float uTime, uLt;
uniform float uSpark, uAsp, uMode, uBands;
uniform float uRelief, uSpec, uShin, uRefl, uRefr, uIrid, uIridF, uEmit, uDepth, uGrain, uGlint, uPig;
uniform vec3 uBg, uSparkCol; uniform vec3 uRamp[6]; uniform float uRW[6]; uniform float uSoft, uStreak;
vec3 pal(float t){ float x = clamp(t,0.,1.)*5.0; int i = min(int(floor(x)),4); float f = x-float(i); return mix(uRamp[i], uRamp[i+1], smoothstep(0.,1.,f)); }

vec2 h2(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float sparkles(vec2 uv, float t){

    float sc = L==0 ? 9.0 : 17.0;
    vec2 p = uv*vec2(uAsp,1.)*sc + float(L)*13.7; vec2 cid=floor(p), f=fract(p);
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(i,j); vec2 h=h2(cid+g);
      if(h.x < 0.3) continue;

      vec2 d = (f-pos)/sc*9.0; float d2=dot(d,d);

vec3 env(vec3 R, vec3 L){
  float ang = atan(R.y,R.x)/6.28318;

  vec3 e = mix(uBg, pal(0.15+ang*0.6)*0.9, smoothstep(0.05,0.9,rr));
  float box = smoothstep(0.82,0.98, dot(normalize(R), normalize(L+vec3(0,0,0.4))));

}
void main(){
  vec2 ts = vec2(textureSize(uH,0)); vec2 px = 1.0/ts;

  float hd = texture(uH, vUv-vec2(0,px.y)).r, hu = texture(uH, vUv+vec2(0,px.y)).r;
  float k = uRelief * ts.y * 0.06;

  vec3 V = vec3(0,0,1);
  vec3 L = normalize(vec3(cos(uLt)*0.7, sin(uLt*0.83)*0.5+0.35, 0.75));

  vec3 R = reflect(-V, n);

  col *= mix(1.0, smoothstep(-0.15,0.75,h), uDepth);

// Pass 3: mirror voxel (square mirror panel, concave mirror funnel, round screen in the middle)
const FS_V = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uC; uniform vec2 uRes; uniform float uAmt, uTime, uPop, uPulse;
uniform sampler2D uCam; uniform float uCamMix, uCamAsp, uMelt, uCryst, uCamFront;
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
vec3 vid(vec2 q){ float m=min(uRes.x,uRes.y); return texture(uC, 0.5 + q*0.5*vec2(m/uRes.x, m/uRes.y)).rgb; }
// the room in front of the voxel, as seen in the mirror (bright ceiling, columns, people, floor)
vec3 room(vec2 v){
  float x=v.x, y=v.y;
  vec3 ceilc=vec3(0.93,0.93,0.96), mid=vec3(0.58,0.58,0.62), flo=vec3(0.74,0.68,0.63);
  vec3 c = y>0.0 ? mix(mid, ceilc, smoothstep(0.0,0.9,y)) : mix(mid, flo, smoothstep(0.0,-0.9,y));
  c *= 1.0 - 0.6*pow(0.5+0.5*sin(x*4.3+1.0+0.6*sin(y*2.0)), 16.0);
  c *= 1.0 - 0.45*pow(0.5+0.5*sin(x*9.7-2.0), 26.0)*smoothstep(0.35,-0.25,y);
  c += 0.3*pow(0.5+0.5*sin(x*2.1+y*1.3), 30.0);
  vec2 d1=v-vec2(-0.35,0.9), d2=v-vec2(0.55,0.75);
  c += vec3(1.0,0.95,0.85)*(0.7*exp(-dot(d1,d1)*30.0) + 0.5*exp(-dot(d2,d2)*45.0));
  return c;
}
// camera image as the reflected surroundings: the centre of the frame (your face) is pushed aside so the scenery fills the mirror
vec3 cam(vec2 v){
  float r = length(v); vec2 d = r>1e-4 ? v/r : vec2(0.,1.);
  // front camera: only the outer ring of the frame (no face); back camera / images: almost the whole frame
  float rr = mix(0.18 + 0.78*smoothstep(0.0,1.5,r), 0.62 + 0.36*smoothstep(0.0,1.5,r), uCamFront);
  vec2 sc = uCamAsp>1.0 ? vec2(1.0/uCamAsp, 1.0) : vec2(1.0, uCamAsp);
  if(uCamFront>0.5) sc = vec2(1.0);                                      // use the corners of the frame too
  vec2 uv = 0.5 + d*rr*0.5*sc; if(uCamFront>0.5) uv.x = 1.0-uv.x;

vec3 env(vec2 v){ return uCamMix>0.001 ? mix(room(v), cam(v), uCamMix) : room(v); }
void main(){

  float me = uMelt, cr = uCryst;

  u += lw*0.16*me*me;

  float box = max(abs(u.x),abs(u.y));

  float crad = smoothstep(0.0, 0.6, me);                                 // corners round off, finally a blob
  vec2 qb = abs(u) - vec2(1.0-crad);
  float sd = length(max(qb,0.0)) + min(max(qb.x,qb.y),0.0) - crad + me*me*0.28*(1.0+0.35*lw.x);

    float h1 = mix(hash(tid),0.5,fu), h2 = mix(hash(tid+7.31),0.5,fu), h3 = mix(hash(tid+3.7),0.5,fu);
    vec2 wob = vec2(sin(uTime*0.9 + u.y*3.0 + h1*6.28), cos(uTime*0.7 + u.x*3.0 + h2*6.28))*(1.0+uPulse*2.5) + dir*uPulse*0.6;   // breathing membrane, throbbing with the heartbeat
    // flat front-facing panel: reflects the room in front of it, hardly any video
    vec2 tng = vec2(-dir.y, dir.x);
    vec2 bulge = dir*pow(segf-0.5,2.0)*0.7 + tng*(segf-0.5)*0.3;            // each panel is slightly bent -> curved reflections
    vec3 flatC = env(P*0.85 + wob*0.035 + (vec2(h1,h2)-0.5)*0.22 + bulge);
    flatC += ringGlow*0.06*exp(-(rhoB-rb)*6.0);

    vec3 bowlRoom = env(-dir*(0.1+1.35*tb) + wob*0.02 + tng*(segf-0.5)*0.25 + (vec2(h1,h2)-0.5)*0.1);
    float tl = clamp((len-rs)/(rb-rs),0.,1.)/0.45;

    col *= 0.9 + 0.18*h3;
    col += uCamMix*vec3(0.10)*pow(max(0.0, 1.0-abs(segf-0.5)*2.0), 6.0)*(1.0-inBowl);   // glossy sheen down the middle of each panel
    // seams: cut gaps between mirror panels - dark gap, bright bevel on one side, shadow on the other
    float side = segf < 0.5 ? 1.0 : -1.0;
    float dRad = min(segf,1.0-segf)*(6.28318/NS)*len;
    float nb = floor(trb+0.5);
    float onRing = (nb>1.5 && nb<2.5 && inBowl>0.5) ? 0.6 : 0.0;
    float dRow = abs(trb-nb)*(rb-rs)/3.0;
    float sideR = trb > nb ? 1.0 : -1.0;
    float ob = floor((len-rb)/0.17+0.5); float dOut = abs((len-rb)/0.17-ob)*0.17; float onOut = 0.0;
    float sideO = (len-rb)/0.17 > ob ? 1.0 : -1.0;
    float g = px*1.1;
    float gapR = 1.0-smoothstep(g*0.4, g, dRad);
    float bevR = exp(-pow((dRad-g*1.8)/(g*0.9),2.0));
    float gapC = onRing*(1.0-smoothstep(g*0.4, g, dRow)) + onOut*(1.0-smoothstep(g*0.4, g, dOut));
    float bevC = onRing*exp(-pow((dRow-g*1.8)/(g*0.9),2.0))*sideR + onOut*exp(-pow((dOut-g*1.8)/(g*0.9),2.0))*sideO;
    gapR*=1.0-fu; bevR*=1.0-fu; gapC*=1.0-fu; bevC*=1.0-fu;
    col += vec3(0.75)*bevR*max(side,0.0) + vec3(0.6)*max(bevC,0.0);
    col *= 1.0 - 0.45*bevR*max(-side,0.0) - 0.35*max(-bevC,0.0);
    col = mix(col, vec3(0.05,0.05,0.06), max(gapR, gapC)*0.85);
    col *= mix(0.2, 1.0, smoothstep(rs, rs+0.03, len));
    col += rim*0.5*exp(-(len-rs)*60.0);
    col += rim*uPulse*0.35*exp(-(len-rs)*6.0);

  col += vec3(0.6,0.62,0.66)*bev*(1.0-fu*0.7);
  // ---- dissolving: first the voxel turns into a blob of liquid metal (mercury-like chrome)
  if(me>0.0 && sd<0.02){
    vec2 nxy = lw*0.32*me + (u/max(len,1e-3))*smoothstep(-0.4,0.0,sd)*1.1
             + 0.12*vec2(sin(u.x*9.0+uTime*3.1), cos(u.y*8.0-uTime*2.7))*me;
    vec3 n2 = normalize(vec3(nxy, 1.0));
    vec3 Lm = normalize(vec3(-0.45,0.6,1.0)), Hm = normalize(Lm+vec3(0,0,1));
    vec3 rc = env(n2.xy*1.7 + P*0.25);
    rc = pow(rc, vec3(1.9))*1.45;                                          // high contrast chrome
    rc += vid(normalize(nxy+1e-4)*0.7)*0.18*smoothstep(0.2,0.8,length(nxy));   // a little of the colour reflected
    float spec = pow(max(dot(n2,Hm),0.0), 90.0)*2.2 + pow(max(dot(n2,Hm),0.0), 12.0)*0.25;
    float fr = pow(1.0-n2.z, 3.0);
    vec3 chrome = rc*(0.75+0.5*fr) + vec3(1.0,0.98,0.95)*spec;
    chrome *= 1.0 - 0.55*smoothstep(-0.03,0.0,sd)*(1.0-step(0.0,sd));      // dark rim where the blob curves away
    col = mix(col, chrome, smoothstep(0.05,0.45,me));
  }
  // ---- dissolving: end as smooth liquid
  if(me>0.0){
    vec3 liquid = texture(uC, clamp(vUv + lw*0.012*me, 0.0, 1.0)).rgb;
    col = mix(col, liquid, max(smoothstep(0.6,1.0,me), step(0.0,sd)*smoothstep(0.05,0.6,me)));

    col *= mix(1.0, 0.65+0.7*hash(mc+1.3), facetAmt);
    col += vec3(0.75,0.9,1.0)*(0.6*facetAmt*(1.0-smoothstep(0.0,0.06,md-0.33)));   // frosty grain edges
    col += vec3(0.85,0.95,1.0)*exp(-pow(front/0.035,2.0))*1.3;                       // bright freezing front
    vec3 cool = full*mix(1.0,0.8,cr) + vec3(0.04,0.07,0.12)*cr;
    col = mix(cool, col, solid);
  }
  o = vec4(mix(full, col, smoothstep(0.0,0.35,uAmt)), 1.0);
}`;

      f.cancelScheduledValues(t); f.setValueAtTime(160,t); f.linearRampToValueAtTime(650,t+2.5); f.linearRampToValueAtTime(160,t+7);
      nextSwell = t + 9 + Math.random()*7; }
    if(nextRumble < now){                                  // the ground rumbles: ゴゴゴ…
      const g=rumbleG.gain, t=now;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0.7,t+1.8); g.setValueAtTime(0.7,t+3.5); g.linearRampToValueAtTime(0.05,t+7);
      rumbleF.frequency.cancelScheduledValues(t); rumbleF.frequency.setValueAtTime(110,t); rumbleF.frequency.linearRampToValueAtTime(220,t+2); rumbleF.frequency.linearRampToValueAtTime(110,t+7);
      nextRumble = t + 11 + Math.random()*10; }
    beats = beats.filter(b=>b.t > now-2);
  }
  return {
    toggle(){ if(!ctx) build(); on=!on;
      if(on){ ctx.resume(); master.gain.setTargetAtTime(vol,ctx.currentTime,0.3); timer=setInterval(schedule,80); schedule(); }
      else { if(navigator.vibrate) navigator.vibrate(0); master.gain.setTargetAtTime(0,ctx.currentTime,0.25); clearInterval(timer); setTimeout(()=>{ if(!on) ctx.suspend(); },1200); }
      return on; },
    setVib(v){ vib=v; if(!v && navigator.vibrate) navigator.vibrate(0); },
    setVol(v){ vol=v; if(ctx&&on) master.gain.setTargetAtTime(vol,ctx.currentTime,0.1); },
    pulse(){ if(!ctx||!on) return 0; const now=ctx.currentTime; let p=0;
      for(const b of beats){ const d=now-b.t; if(d>=0) p += b.a*Math.exp(-d*7.0); } return Math.min(1,p*0.6); },
    track(){ return (ctx&&on) ? recDest.stream.getAudioTracks()[0] : null; },
  };
})();
$("bSnd").onclick=()=>{ const on=snd.toggle(); if(on && navigator.vibrate){ try{ navigator.vibrate(30); }catch(e){} } const b=$("bSnd"); b.classList.toggle("on",on);
 };
const heartEmo=document.querySelector("#bSnd .emo");
$("vibTest").onclick=()=>{
  if(!("vibrate" in navigator)){ toast("このブラウザは振動に非対応です"); return; }
  let ok=false; try{ ok = navigator.vibrate([200,120,200]); }catch(e){}
  toast(ok ? "振動の命令を送りました。震えない場合は端末の設定を確認してください" : "ブラウザに振動を断られました"); };
$("vib").onchange=e=>snd.setVib(e.target.value==="1");
if(!("vibrate" in navigator)) $("vibRow").querySelector("select").innerHTML='<option>この端末は非対応</option>';
$("vol").oninput=e=>{ snd.setVol(+e.target.value); $("volo").textContent=(+e.target.value).toFixed(2); };

// ---------------------------------------------------------------- recording
let rec=null;
$("bRec").onclick=()=>{
  if (rec){ rec.stop(); return; }
  if (!cv.captureStream || !window.MediaRecorder){ toast("このブラウザは記録非対応です"); return; }
  const types=snd.track() ? ["video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm"] : ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  const type=types.find(t=>MediaRecorder.isTypeSupported(t)) || "";
  const len=+$("recLen").value;
  recLock=[cv.width - cv.width%2, cv.height - cv.height%2]; resize();
  const stream=cv.captureStream(30); const at=snd.track(); if(at) stream.addTrack(at);
  const mr=new MediaRecorder(stream, { mimeType:type, videoBitsPerSecond: 12e6 });
  const chunks=[]; mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const t0=performance.now(); const bar=$("recbar"); bar.style.display="block";
  const tick=setInterval(()=>{ const s=(performance.now()-t0)/1000; bar.textContent=`REC ${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')} / ${Math.floor(len/60)}:${String(len%60).padStart(2,'0')}`; if(s>=len) mr.stop(); },250);
  mr.onstop=async()=>{ clearInterval(tick); bar.style.display="none"; rec=null; recLock=null; resize(); $("bRec").classList.remove("recording"); $("bRec").querySelector("span").textContent="記録";
    const ext = (mr.mimeType||type).includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type:mr.mimeType||type});
    const d=new Date(), pad=n=>String(n).padStart(2,"0");
    const name=`nurunuru-kodou-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
    try {
      const dl = window.claude?.use ? await window.claude.use("downloads") : null;
      if (dl) { try { await dl.save({ filename:name, data:blob }); toast("保存しました"); } catch(e){ toast(e?.code==="declined"?"保存をキャンセルしました":"保存できませんでした"); } return; }
    } catch(e){}
    const file=new File([blob],name,{type:blob.type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { try{ await navigator.share({files:[file]}); return; }catch(e){} }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("保存しました"); };
  mr.start(500); rec=mr; $("bRec").classList.add("recording"); $("bRec").querySelector("span").textContent="記録停止";
};

// ---------------------------------------------------------------- render loop
const lerp=(a,b,t)=>a+(b-a)*t, lerp3=(a,b,t)=>a.map((x,i)=>lerp(x,b[i],t));
function currentPalette(dt){
  const p=PALETTES[palIdx];
  if(!p.cycle) return p;
  cyc += dt/20;                                   // 20 s per color
  const n=PALETTES.length-1, i=Math.floor(cyc)%n, j=(i+1)%n;
  let f=cyc%1; f = f<.7 ? 0 : (f-.7)/.3; f=f*f*(3-2*f);
  const A=PALETTES[i], B=PALETTES[j], o={};
  o.ramp = A.ramp.map((c,k)=>lerp3(c,B.ramp[k],f)); o.w = (A.w||DEFW).map((x,k)=>lerp(x,(B.w||DEFW)[k],f)); for(const k of ["bg","spark"]) o[k]=lerp3(A[k],B[k],f);
  for(const k of ["irid","iridF","spec"]) o[k]=lerp(A[k],B[k],f);
  return o;
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  if (paused) return;
  freezeK += ((frozen?0:1)-freezeK)*Math.min(1,dt*1.5);
  simT += dt*freezeK; lightT += dt*0.18; wallT += dt;
  touch.s += (touch.target-touch.s)*Math.min(1,dt*4);
  if(!touch.active) touch.target *= Math.pow(0.35, dt);

  resize();
  // vortices
  const V=new Float32Array(32); let vn=0;
  for(let i=0;i<P.vortN;i++){ const v=vortSeeds[i];
    V.set([v.x+v.ax*Math.sin(simT*v.wx+v.ph), v.y+v.ay*Math.cos(simT*v.wy+v.ph*1.3),
           v.sgn*P.vortStr*(0.85+0.25*Math.sin(simT*0.21+i)), v.r], vn*4); vn++; }
  if (Math.abs(touch.s)>0.01){ V.set([touch.x,touch.y,touch.s,0.16], vn*4); vn++; }
  stepHoles(dt*freezeK, simT);
  const HB=new Float32Array(24);
  for(let i=0;i<P.holes;i++){ const h=holes[i]; HB.set([h.x,h.y,0.04*P.holeSize*h.sz, h.sw*P.holeTwist*(0.8+0.3*Math.sin(simT*0.19+h.ph))], i*4); }

  // pass 1: height
  gl.bindFramebuffer(gl.FRAMEBUFFER,hFbo); gl.viewport(0,0,hW,hH);
  gl.useProgram(PH.p); const u=PH.u;
  gl.uniform2f(u.uRes,hW,hH); gl.uniform1f(u.uTime,simT); gl.uniform1f(u.uBoil,P.boil); gl.uniform1f(u.uFlow,P.flow);
  gl.uniform1f(u.uScale,P.scale); gl.uniform1f(u.uWarp,P.warp); gl.uniform1f(u.uFine,P.fine); gl.uniform1f(u.uRidge,P.ridge);
  gl.uniform1f(u.uCell,P.cell); gl.uniform2f(u.uSeed,seed[0],seed[1]); gl.uniform4fv(u.uV,V); gl.uniform1i(u.uVN,vn);
  gl.uniform4fv(u.uHole,HB); gl.uniform1i(u.uHN,P.holes); gl.uniform1f(u.uRingAmp,P.ringAmp); gl.uniform1f(u.uRingF,P.ringF); gl.uniform1f(u.uMirror,mirror?1:0); gl.uniform1f(u.uStretch,P.stretch); gl.uniform1f(u.uOct, P.mode>0.5?4:5);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // pass 2: shade
  const pal=currentPalette(dt);
  voxAmt = voxOn ? voxAmt + (1-voxAmt)*Math.min(1,dt*2.2) : Math.max(0, voxAmt-dt/3.2);   // pop in / melt in 3.2 s
  const useVox = voxAmt>0.0001;
  gl.bindFramebuffer(gl.FRAMEBUFFER, useVox?cFbo:null); gl.viewport(0,0,cv.width,cv.height);
  gl.useProgram(PS.p); const s=PS.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hTex); gl.uniform1i(s.uH,0);
  gl.uniform2f(s.uRes,cv.width,cv.height); gl.uniform1f(s.uTime,wallT); gl.uniform1f(s.uLt,lightT);
  gl.uniform1f(s.uRelief,P.relief); gl.uniform1f(s.uSpec,P.spec*pal.spec); gl.uniform1f(s.uShin,P.shin);
  gl.uniform1f(s.uRefl,P.refl); gl.uniform1f(s.uRefr,P.refr); gl.uniform1f(s.uIrid,Math.min(1,pal.irid*P.irid));
  gl.uniform1f(s.uIridF,pal.iridF); gl.uniform1f(s.uEmit,P.emit); gl.uniform1f(s.uDepth,P.depth);
  gl.uniform1f(s.uGrain,P.grain); gl.uniform1f(s.uGlint,P.glint); gl.uniform1f(s.uPig,P.pig); gl.uniform1f(s.uSpark,P.spark); gl.uniform1f(s.uMode,P.mode); gl.uniform1f(s.uBands,P.bands); gl.uniform1f(s.uAsp,cv.width/cv.height);
  gl.uniform3fv(s.uRamp, pal.ramp.flat()); gl.uniform1fv(s.uRW, pal.w||DEFW); gl.uniform3fv(s.uBg,pal.bg); gl.uniform3fv(s.uSparkCol,pal.spark); gl.uniform1f(s.uSoft,P.soft); gl.uniform1f(s.uStreak,P.streak);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if (useVox){
    // pop-in with a little elastic overshoot
    const x=voxAmt, pop = voxOn ? 1 + Math.sin(x*Math.PI)*0.06*(1-x) - Math.pow(1-x,3) : 1, crystP = 0, meltP = (!voxOn) ? 1-voxAmt : 0;
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height);
    let camW=1, camH=1, camReady=false;
    if(camSrc){ camW = camIsVideo ? camSrc.videoWidth : camSrc.naturalWidth; camH = camIsVideo ? camSrc.videoHeight : camSrc.naturalHeight;
      camReady = camW>0 && camH>0 && (!camIsVideo || camSrc.readyState>=2);
      if(camReady && mirOn && (camIsVideo || camDirty)){ gl.bindTexture(gl.TEXTURE_2D, camTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,camSrc); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); camDirty=false; } }
    camMix += (((mirOn&&camReady)?1:0)-camMix)*Math.min(1,dt*2);
    gl.useProgram(PV.p); const v=PV.u;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,camTex); gl.uniform1i(v.uCam,1);
    gl.uniform1f(v.uCamMix,camMix); gl.uniform1f(v.uCamFront, camKind==='front'?1:0); gl.uniform1f(v.uCamAsp, camW/Math.max(1,camH));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,cTex); gl.uniform1i(v.uC,0);
    gl.uniform2f(v.uRes,cv.width,cv.height); gl.uniform1f(v.uAmt, voxOn ? voxAmt : 1); gl.uniform1f(v.uCryst,crystP); gl.uniform1f(v.uMelt,meltP); gl.uniform1f(v.uTime,wallT); gl.uniform1f(v.uPop,Math.max(0.02,pop)); const pl=snd.pulse(); gl.uniform1f(v.uPulse, pl); heartEmo.classList.toggle("beat", pl>0.25);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
}
resize(); requestAnimationFrame(frame);
</script>
